<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pedal to the Metal OS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <h1>⚙️ Pedal to the Metal OS</h1>
  <div class="modes">
    <button onclick="setMode('overview')">Overview</button>
    <button onclick="setMode('work')">Work Mode</button>
    <button onclick="setMode('home')">Home Mode</button>
  </div>
</header>

<main>
  <iframe id="todayPanel" src="panels/today.html"></iframe>
</main>

<script>
function setMode(mode) {
  const panel = document.getElementById("todayPanel");
  panel.contentWindow.postMessage({ mode: mode }, "*");
}
</script>

</body>
</html>
